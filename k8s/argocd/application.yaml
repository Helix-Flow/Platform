apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helixflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/helixflow/platform.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: helixflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
