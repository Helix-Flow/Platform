apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helixflow.fullname" . }}-config
  labels:
    {{- include "helixflow.labels" . | nindent 4 }}
data:
  CLUSTER_NAME: "helixflow"
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  {{- if .Values.postgresql.enabled }}
  DATABASE_TYPE: "postgres"
  {{- else }}
  DATABASE_TYPE: "sqlite"
  {{- end }}
