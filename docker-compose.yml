version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: helixflow-postgres
    environment:
      POSTGRES_DB: helixflow
      POSTGRES_USER: helixflow
      POSTGRES_PASSWORD: helixflow_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/postgresql-helixflow-complete.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - helixflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helixflow -d helixflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: helixflow-redis
    command: redis-server --requirepass helixflow_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - helixflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: helixflow-api-gateway
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - PORT=8080
      - INFERENCE_POOL_URL=inference-pool:50051
      - AUTH_SERVICE_GRPC=auth-service:8081
      - AUTH_SERVICE_URL=http://auth-service:8082
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=helixflow_redis_pass
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://helixflow:helixflow_secure_pass@postgres:5432/helixflow
      - LOG_LEVEL=INFO
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inference-pool:
        condition: service_started
    networks:
      - helixflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: helixflow-auth-service
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - PORT=8081
      - HTTP_PORT=8082
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://helixflow:helixflow_secure_pass@postgres:5432/helixflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=helixflow_redis_pass
      - TLS_CERT=/app/certs/server-cert.pem
      - TLS_KEY=/app/certs/server-key.pem
      - LOG_LEVEL=INFO
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - helixflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Inference Pool
  inference-pool:
    build:
      context: .
      dockerfile: inference-pool/Dockerfile
    container_name: helixflow-inference-pool
    ports:
      - "50051:50051"
    environment:
      - PORT=50051
      - TLS_CERT=/app/certs/server-cert.pem
      - TLS_KEY=/app/certs/server-key.pem
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=helixflow_redis_pass
      - LOG_LEVEL=INFO
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - helixflow-network
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'echo > /dev/tcp/localhost/50051' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Monitoring Service
  monitoring:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    container_name: helixflow-monitoring
    ports:
      - "8083:8083"
      - "50053:50053"
    environment:
      - MONITORING_PORT=8083
      - MONITORING_GRPC_PORT=50053
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=helixflow_redis_pass
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://helixflow:helixflow_secure_pass@postgres:5432/helixflow
      - TLS_CERT=/app/certs/server-cert.pem
      - TLS_KEY=/app/certs/server-key.pem
      - LOG_LEVEL=INFO
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - helixflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: helixflow-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - helixflow-network
    depends_on:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: helixflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - helixflow-network
    depends_on:
      - prometheus

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: helixflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
      - ./secrets:/etc/nginx/secrets
    depends_on:
      - api-gateway
      - auth-service
      - inference-pool
      - monitoring
    networks:
      - helixflow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  helixflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
